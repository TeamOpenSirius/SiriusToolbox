name: Build, test, and publish

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure GitHub Packages credentials
        shell: pwsh
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore .\SiriusTools.sln

      - name: Run smoke test
        shell: pwsh
        run: .\scripts\smoke-test.ps1

      - name: Publish CLI binaries
        shell: pwsh
        run: |
          $rids = @('win-x64', 'linux-x64', 'osx-arm64')
          foreach ($rid in $rids) {
            dotnet publish .\src\Sirius.Toolbox.Cli\Sirius.Toolbox.Cli.csproj -c Release -r $rid --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ".\artifacts\cli-$rid"
            Compress-Archive -Path ".\artifacts\cli-$rid\*" -DestinationPath ".\artifacts\sirius-toolbox-cli-$rid.zip" -Force
          }

      - name: Publish Windows UI
        shell: pwsh
        run: |
          dotnet publish .\src\Sirius.ToolboxUI\Sirius.ToolboxUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\ui-win-x64
          Compress-Archive -Path .\artifacts\ui-win-x64\* -DestinationPath .\artifacts\sirius-toolbox-ui-win-x64.zip -Force

      - name: Repository security scan
        shell: pwsh
        run: python .\scripts\check-repository.py

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: sirius-toolbox-binaries
          path: artifacts/*.zip
