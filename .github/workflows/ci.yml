name: Build, test, and publish

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      # A classic PAT with read:packages is required because Sirius.Data packages
      # are owned by the TeamOpenSirius organization and may not grant access to
      # this repository's GITHUB_TOKEN. Configure this repository secret in GitHub.
      SIRIUSDATA_PACKAGES_TOKEN: ${{ secrets.SIRIUSDATA_PACKAGES_TOKEN }}
      NuGetPackageSourceCredentials_github: Username=${{ secrets.SIRIUSDATA_PACKAGES_USERNAME || github.actor }};Password=${{ secrets.SIRIUSDATA_PACKAGES_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate GitHub Packages credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIRIUSDATA_PACKAGES_TOKEN)) {
            throw 'Missing SIRIUSDATA_PACKAGES_TOKEN repository secret. Create a classic PAT with read:packages and grant this repository access to the Sirius.Data packages.'
          }
          dotnet restore .\SiriusTools.sln --verbosity minimal

      - name: Run smoke test
        shell: pwsh
        run: .\scripts\smoke-test.ps1

      - name: Publish CLI binaries
        shell: pwsh
        run: |
          $rids = @('win-x64', 'linux-x64', 'osx-arm64')
          foreach ($rid in $rids) {
            dotnet publish .\src\Sirius.Toolbox.Cli\Sirius.Toolbox.Cli.csproj -c Release -r $rid --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ".\artifacts\cli-$rid"
            Compress-Archive -Path ".\artifacts\cli-$rid\*" -DestinationPath ".\artifacts\sirius-toolbox-cli-$rid.zip" -Force
          }

      - name: Publish Windows UI
        shell: pwsh
        run: |
          dotnet publish .\src\Sirius.ToolboxUI\Sirius.ToolboxUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\ui-win-x64
          Compress-Archive -Path .\artifacts\ui-win-x64\* -DestinationPath .\artifacts\sirius-toolbox-ui-win-x64.zip -Force

      - name: Repository security scan
        shell: pwsh
        run: python .\scripts\check-repository.py

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: sirius-toolbox-binaries
          path: artifacts/*.zip
